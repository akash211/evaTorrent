[project]
name = "evatorrent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Akash Kumar", email = "akash211@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.10.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
