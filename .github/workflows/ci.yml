name: CI/CD Pipeline (Rust)

on:
  push:
    branches: [ "main", "rust-rewrite" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "rust-rewrite" ]

jobs:
  test:
    name: Cargo Check, Clippy & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release --bin evatorrent

  docker:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_LOGIN_ID || 'akashkece' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PERSONAL_ACCESS_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: akashkece/evatorrent
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dedicated scope: keeps the rust-rewrite layer chains isolated from
          # the stale python-era blobs still sitting in the repo GHA cache
          # (that pipeline's Dockerfile/workflow differ, so blind reuse is unsafe).
          cache-from: type=gha,scope=evatorrent-rust
          cache-to: type=gha,mode=max,scope=evatorrent-rust

      # Regression gate for the 2026-10-16 incident where dependency-cache stub
      # compilation shipped a `fn main() {}` binary as the engine: CI was green,
      # image pushed, container exited instantly with no logs.
      - name: Verify Runtime Image (stub-binary regression gate)
        run: |
          IMAGE="akashkece/evatorrent:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"

          # 1) Binary sanity: must be the real engine (multi-MB), not a ~324 KB
          #    `fn main() {}` stub.
          BINSIZE=$(docker run --rm --entrypoint stat "$IMAGE" -c %s /usr/local/bin/evatorrent)
          echo "evatorrent binary size: ${BINSIZE:-0} bytes"
          if [ "${BINSIZE:-0}" -lt 1048576 ]; then
            echo "::error::evatorrent binary is only ${BINSIZE:-0} bytes - stub build leaked into image"
            exit 1
          fi

          # 2) Boot test: the web server must start and answer the health
          #    endpoint. A no-op stub exits within milliseconds with no logs.
          docker run --rm -d --name eva-smoke --publish 18080:8080 "$IMAGE"
          ok=""
          for _ in $(seq 1 30); do
            if ! docker ps --filter name=eva-smoke --format '{{.Status}}' | grep -q '^Up'; then
              echo "::error::Container exited immediately (stub/no-op binary):"
              docker logs eva-smoke || true
              docker rm -f eva-smoke >/dev/null 2>&1 || true
              exit 1
            fi
            if curl -fsS http://127.0.0.1:18080/api/auth/status >/dev/null 2>&1; then
              ok=yes
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Smoke test failed: /api/auth/status never responded"
            docker logs eva-smoke || true
            docker rm -f eva-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          echo "Smoke test passed: binary boots and serves /api/auth/status"
          docker stop eva-smoke >/dev/null
