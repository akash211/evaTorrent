services:
  evatorrent:
    image: akashkece/evatorrent:0.9.3
    container_name: evatorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    volumes:
      - ./downloads:/downloads
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      # Initial Administrator Email (or set via Web UI on first launch)
      - ADMIN_EMAIL=
      # Optional Google OAuth 2.0 Client ID for Google Sign-In
      - GOOGLE_CLIENT_ID=
      # Set to true when running behind HTTPS reverse proxy or domain
      - SECURE_COOKIES=false
      # Set to true to enforce automatic HTTPS redirect for all non-local domain requests
      - ENFORCE_HTTPS=false
      # Optional Outbound SMTP for Email OTP delivery (if empty, OTP logs to docker console)
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_FROM=
      # Optional Discover enrichment (no key required for base lookup)
      # TMDB key unlocks accurate budget/box-office + India OTT providers
      - TMDB_API_KEY=
      # OMDb key unlocks IMDb/RT ratings, box office, languages
      - OMDB_API_KEY=
      # Resource safety (large torrents): unset = built-in defaults with
      # automatic down-tuning for 20 GB+ torrents (max 15 peers / 4 pipeline).
      - EVA_MAX_PEERS=
      - EVA_PIPELINE_PER_PEER=
      - EVA_MAX_ONGOING_PIECES=
      - EVA_STREAM_BUFFER_LIMIT=
      - EVA_TELEMETRY_SECS=
      - EVA_VERIFY_ON_STARTUP=
      # Seconds between [PROGRESS] docker-log lines per torrent (0 disables)
      - EVA_PROGRESS_LOG_SECS=
      # Optional keyed subtitle provider (keyless Yify/OpenSubtitles.org first)
      - OPENSUBTITLES_API_KEY=
